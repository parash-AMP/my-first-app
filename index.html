<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102f2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AMP">
  <meta name="description" content="AMP — property, discipline, life admin and goal journeys in one beautifully simple personal dashboard.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>AMP — Personal Space</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Desktop navigation">
      <a class="brand" href="#home" data-page="home" aria-label="AMP home"><span class="brand-mark">a<span>·</span></span><span class="brand-word">AMP<span>PERSONAL SPACE</span></span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="desktopNav" class="sidebar-nav"></nav>
      <div class="sidebar-bottom"><span class="online-dot"></span> Built for your life <span class="small-muted">v1.0</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left"><button class="mobile-brand" data-page="home" aria-label="Go to dashboard">a<span>·</span></button><div class="page-identity"><span id="breadcrumb" class="tiny-overline">AMP / OVERVIEW</span><span id="topTitle">Your space</span></div></div>
        <div class="top-right"><span class="today-date" id="todayDate"></span><button class="round-utility" data-action="backup" aria-label="Backup and settings" title="Backup and privacy"><span id="settingsIcon"></span></button></div>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"></main>
      <nav id="mobileNav" class="bottom-nav" aria-label="Main navigation"></nav>
    </div>
  </div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <script defer src="app.js"></script>
</body>
</html>
